name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to build (e.g. v0.1.6). Leave empty to build the latest git tag.'
        required: false
        default: ''

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            # Deterministic paths — no `find | head` pipelines (see below).
            bundle_dir: 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos'
            bundle_name: 'avdl.app'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            binary_path: 'src-tauri/target/release/avdl.exe'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            binary_path: 'src-tauri/target/release/avdl'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Release Tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            git fetch --tags --force
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.1.5)"
          fi
          echo "EFFECTIVE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using release tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync Version from Git Tag
        shell: bash
        run: node scripts/version.cjs ${{ env.EFFECTIVE_TAG }}

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.EFFECTIVE_TAG }}
          releaseName: 'AVDL ${{ env.EFFECTIVE_TAG }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Portable (installer-free) artifacts for all three platforms.
      #
      # NOTE: previous versions located binaries with `find ... | head -n 1`.
      # GitHub Actions runs bash with `-e -o pipefail`, so when `find` matched
      # more than one file (e.g. the DMG staging copy of the .app bundle) `head`
      # closed the pipe early, `find` died with SIGPIPE (exit 141) and the whole
      # step — and job — failed, silently skipping the macOS binary upload.
      # We now use explicit, per-platform paths and fail with a clear message.
      - name: Upload Portable Binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE_TAG: ${{ env.EFFECTIVE_TAG }}
        run: |
          set -euo pipefail
          TAG="${EFFECTIVE_TAG}"
          echo "Packaging portable artifact for ${TAG}"
          # Make sure the release exists even if this job is the first to finish.
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "AVDL ${TAG}" --notes ""

          case "${{ matrix.platform }}" in
            macos-latest)
              APP_DIR="${{ matrix.bundle_dir }}"
              APP_NAME="${{ matrix.bundle_name }}"
              ZIP_NAME="AVDL_${TAG}_mac_arm64.zip"
              echo "Checking bundle at ${APP_DIR}/${APP_NAME}"
              ls -la "${APP_DIR}" || true
              if [ ! -d "${APP_DIR}/${APP_NAME}" ]; then
                echo "::error::macOS app bundle not found at ${APP_DIR}/${APP_NAME}"
                exit 1
              fi
              (cd "${APP_DIR}" && zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${APP_NAME}")
              gh release upload "${TAG}" "${GITHUB_WORKSPACE}/${ZIP_NAME}" --clobber
              ;;
            windows-latest)
              BIN="${{ matrix.binary_path }}"
              EXE_NAME="AVDL_${TAG}_windows_x64.exe"
              if [ ! -f "${BIN}" ]; then
                echo "::error::Windows binary not found at ${BIN}"
                exit 1
              fi
              cp "${BIN}" "${EXE_NAME}"
              gh release upload "${TAG}" "./${EXE_NAME}" --clobber
              ;;
            ubuntu-22.04)
              BIN="${{ matrix.binary_path }}"
              TAR_NAME="AVDL_${TAG}_linux_x64.tar.gz"
              if [ ! -f "${BIN}" ]; then
                echo "::error::Linux binary not found at ${BIN}"
                exit 1
              fi
              cp "${BIN}" ./avdl
              tar -czvf "${TAR_NAME}" avdl
              gh release upload "${TAG}" "./${TAR_NAME}" --clobber
              ;;
          esac
