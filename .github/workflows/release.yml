name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to build (e.g. v0.1.3)'
        required: false
        default: 'v0.1.3'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Release Tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "EFFECTIVE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using release tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync Version from Git Tag
        shell: bash
        run: node scripts/bump.cjs ${{ env.EFFECTIVE_TAG }}

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.EFFECTIVE_TAG }}
          releaseName: 'AVDL ${{ env.EFFECTIVE_TAG }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Portable Binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE_PATH=$(find src-tauri/target -name "avdl.exe" -type f | head -n 1)
          if [ -n "$EXE_PATH" ]; then
            cp "$EXE_PATH" ./AVDL_${{ env.EFFECTIVE_TAG }}_windows_x64.exe
            gh release upload ${{ env.EFFECTIVE_TAG }} ./AVDL_${{ env.EFFECTIVE_TAG }}_windows_x64.exe --clobber
          else
            echo "avdl.exe not found"
            exit 1
          fi

      - name: Upload Portable Binary (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_PATH=$(find src-tauri/target -name "avdl.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            APP_DIR=$(dirname "$APP_PATH")
            APP_NAME=$(basename "$APP_PATH")
            ROOT_DIR=$(pwd)
            (cd "$APP_DIR" && zip -r "$ROOT_DIR/AVDL_${{ env.EFFECTIVE_TAG }}_mac_arm64.zip" "$APP_NAME")
            gh release upload ${{ env.EFFECTIVE_TAG }} ./AVDL_${{ env.EFFECTIVE_TAG }}_mac_arm64.zip --clobber
          else
            echo "avdl.app not found"
            exit 1
          fi

      - name: Upload Portable Binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BIN_PATH=$(find src-tauri/target -name "avdl" -type f ! -name "*.d" | head -n 1)
          if [ -n "$BIN_PATH" ]; then
            cp "$BIN_PATH" ./avdl
            tar -czvf ./AVDL_${{ env.EFFECTIVE_TAG }}_linux_x64.tar.gz avdl
            gh release upload ${{ env.EFFECTIVE_TAG }} ./AVDL_${{ env.EFFECTIVE_TAG }}_linux_x64.tar.gz --clobber
          else
            echo "avdl binary not found"
            exit 1
          fi
