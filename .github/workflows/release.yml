name: Release App

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync Version from Git Tag
        shell: bash
        run: node scripts/bump.cjs ${{ github.ref_name }}

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AVDL ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Portable Binary (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/avdl.exe ./AVDL_${{ github.ref_name }}_windows_x64.exe
          gh release upload ${{ github.ref_name }} ./AVDL_${{ github.ref_name }}_windows_x64.exe --clobber

      - name: Upload Portable Binary (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri/target/release/bundle/macos
          zip -r ../../../../AVDL_${{ github.ref_name }}_mac_arm64.zip avdl.app
          cd ../../../..
          gh release upload ${{ github.ref_name }} ./AVDL_${{ github.ref_name }}_mac_arm64.zip --clobber

      - name: Upload Portable Binary (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp src-tauri/target/release/avdl ./avdl
          tar -czvf ./AVDL_${{ github.ref_name }}_linux_x64.tar.gz avdl
          gh release upload ${{ github.ref_name }} ./AVDL_${{ github.ref_name }}_linux_x64.tar.gz --clobber
