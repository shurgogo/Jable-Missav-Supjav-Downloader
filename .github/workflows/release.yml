name: Release App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to build (e.g. v0.1.6). Leave empty to build the latest git tag.'
        required: false
        default: ''

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            args: '--target aarch64-apple-darwin'
            # Deterministic paths — no `find | head` pipelines (see below).
            bundle_dir: 'src-tauri/target/aarch64-apple-darwin/release/bundle/macos'
            bundle_name: 'avdl.app'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
            binary_path: 'src-tauri/target/release/avdl.exe'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''
            binary_path: 'src-tauri/target/release/avdl'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Release Tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            git fetch --tags --force
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.1.5)"
          fi
          echo "EFFECTIVE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using release tag: $TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync Version from Git Tag
        shell: bash
        run: node scripts/version.cjs ${{ env.EFFECTIVE_TAG }}

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.EFFECTIVE_TAG }}
          releaseName: 'AVDL ${{ env.EFFECTIVE_TAG }}'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Pull the release notes straight from CHANGELOG.md — no manual editing
      # on the GitHub release page. The section matching EFFECTIVE_TAG is used
      # (falling back to the first section, e.g. [Unreleased]).
      - name: Update Release Notes from CHANGELOG.md
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE_TAG: ${{ env.EFFECTIVE_TAG }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found — skipping release notes"
            exit 0
          fi
          # Write the extracted section straight to a UTF-8 file. Do NOT print
          # it to stdout: on Windows runners Python's stdout defaults to the
          # ANSI codepage (cp1252) and chokes on non-ASCII changelog text.
          python3 - "$GITHUB_WORKSPACE/CHANGELOG.md" "$EFFECTIVE_TAG" \
            "$GITHUB_WORKSPACE/release_body.md" <<'PYEOF'
          import re, sys
          text = open(sys.argv[1], encoding='utf-8').read()
          version = sys.argv[2].lstrip('v')
          m = re.search(r'(?m)^##\s+\[%s\]' % re.escape(version), text)
          if not m:
              m = re.search(r'(?m)^##\s', text)  # fallback: first section
          if not m:
              sys.exit(0)
          start = m.start()
          m2 = re.search(r'(?m)^##\s', text[start + 1:])
          end = start + 1 + m2.start() if m2 else len(text)
          with open(sys.argv[3], 'w', encoding='utf-8') as out:
              out.write(text[start:end].rstrip() + "\n")
          PYEOF
          gh release edit "$EFFECTIVE_TAG" --notes-file "$GITHUB_WORKSPACE/release_body.md"
          echo "Release notes updated for $EFFECTIVE_TAG from CHANGELOG.md"

      # Portable (installer-free) artifacts for all three platforms.
      #
      # NOTE: previous versions located binaries with `find ... | head -n 1`.
      # GitHub Actions runs bash with `-e -o pipefail`, so when `find` matched
      # more than one file (e.g. the DMG staging copy of the .app bundle) `head`
      # closed the pipe early, `find` died with SIGPIPE (exit 141) and the whole
      # step — and job — failed, silently skipping the macOS binary upload.
      # We now use explicit, per-platform paths and fail with a clear message.
      - name: Upload Portable Binary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EFFECTIVE_TAG: ${{ env.EFFECTIVE_TAG }}
        run: |
          set -euo pipefail
          TAG="${EFFECTIVE_TAG}"
          echo "Packaging portable artifact for ${TAG}"
          # Make sure the release exists even if this job is the first to finish.
          gh release view "${TAG}" >/dev/null 2>&1 || gh release create "${TAG}" --title "AVDL ${TAG}" --notes ""

          case "${{ matrix.platform }}" in
            macos-latest)
              APP_NAME="${{ matrix.bundle_name }}"
              ZIP_NAME="AVDL_${TAG}_mac_arm64.zip"
              APP_DIR=""
              # The bundle lives under the explicit target dir when
              # `--target` is passed; check both layouts to be resilient.
              for candidate in \
                "${{ matrix.bundle_dir }}" \
                "$GITHUB_WORKSPACE/src-tauri/target/release/bundle/macos" ; do
                if [ -d "${candidate}/${APP_NAME}" ]; then
                  APP_DIR="$candidate"
                  break
                fi
              done
              if [ -z "$APP_DIR" ]; then
                echo "::error::macOS app bundle not found. Searching target dir:"
                find "$GITHUB_WORKSPACE/src-tauri/target" -name "*.app" -type d 2>/dev/null | head -10 || true
                echo "--- bundle dirs ---"
                ls -la "$GITHUB_WORKSPACE/src-tauri/target/release/bundle" 2>/dev/null || true
                exit 1
              fi
              (cd "${APP_DIR}" && zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${APP_NAME}")
              gh release upload "${TAG}" "${GITHUB_WORKSPACE}/${ZIP_NAME}" --clobber
              ;;
            windows-latest)
              BIN="${{ matrix.binary_path }}"
              EXE_NAME="AVDL_${TAG}_windows_x64.exe"
              if [ ! -f "${BIN}" ]; then
                echo "::error::Windows binary not found at ${BIN}"
                exit 1
              fi
              cp "${BIN}" "${EXE_NAME}"
              gh release upload "${TAG}" "./${EXE_NAME}" --clobber
              ;;
            ubuntu-22.04)
              BIN="${{ matrix.binary_path }}"
              TAR_NAME="AVDL_${TAG}_linux_x64.tar.gz"
              if [ ! -f "${BIN}" ]; then
                echo "::error::Linux binary not found at ${BIN}"
                exit 1
              fi
              cp "${BIN}" ./avdl
              tar -czvf "${TAR_NAME}" avdl
              gh release upload "${TAG}" "./${TAR_NAME}" --clobber
              ;;
          esac
